<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PAWZ AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d0d1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #ar-wrap { position: fixed; inset: 0; display: none; }
    #ar-wrap a-scene { width: 100%; height: 100%; }

    #start-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      background: #f6f088 url('./ui.png') center top / contain no-repeat;
      z-index: 200;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 32px);
    }
    #start-btn {
      width: calc(100% - 48px); max-width: 340px;
      padding: 18px; border: none; border-radius: 50px;
      background: #4a5aab; color: white; font-size: 20px; font-weight: 800;
      cursor: pointer; letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(74,90,171,.4);
      transition: transform .15s, box-shadow .15s;
    }
    #start-btn:active { transform: scale(.97); }

    #loading-screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.92); z-index: 200; color: white; text-align: center; padding: 24px;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,.15); border-top-color: #e94560;
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { margin-top: 18px; font-size: 15px; opacity: .8; }
    #loading-sub { margin-top:  8px; font-size: 13px; opacity: .45; }

    #error-screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.95); z-index: 200; color: white;
      padding: 32px; text-align: center;
    }
    #err-icon  { font-size: 52px; margin-bottom: 16px; }
    #err-title { font-size: 20px; margin-bottom: 12px; }
    #err-msg   { font-size: 14px; opacity: .7; line-height: 1.8; white-space: pre-line; max-width: 320px; }
    .retry-btn {
      margin-top: 28px; padding: 12px 36px; border-radius: 28px;
      border: 1.5px solid rgba(255,255,255,.35);
      background: transparent; color: white; font-size: 16px; cursor: pointer;
    }

    #hud-status {
      position: fixed;
      top: max(env(safe-area-inset-top, 0px), 16px);
      left: 50%; transform: translateX(-50%);
      padding: 8px 22px; border-radius: 24px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: white; font-size: 14px; font-weight: 600;
      z-index: 100; opacity: 0; transition: opacity .4s;
      pointer-events: none; white-space: nowrap;
    }
    #hud-status.on { opacity: 1; }

    #scan-hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
      left: 50%; transform: translateX(-50%);
      padding: 12px 28px; border-radius: 28px;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: white; font-size: 14px; z-index: 100;
      display: none; text-align: center; max-width: 280px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.85} 50%{opacity:1} }
  </style>

  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="start-screen">
  <button id="start-btn" onclick="startAR()">AR 시작하기</button>
</div>

<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-msg">초기화 중...</div>
  <div id="loading-sub"></div>
</div>

<div id="error-screen">
  <div id="err-icon">⚠️</div>
  <h2 id="err-title">오류 발생</h2>
  <p  id="err-msg"></p>
  <button class="retry-btn" onclick="location.reload()">다시 시도</button>
</div>

<div id="hud-status"></div>
<div id="scan-hint">📷 마커 이미지를 카메라에 비춰주세요</div>

<div id="ar-wrap"></div>

<!-- 4개 영상 (targetIndex 순서와 동일) -->
<video id="video-0" src="./멍송편 ar.mp4"           loop muted playsinline webkit-playsinline preload="auto" style="display:none"></video>
<video id="video-1" src="./멍치킨.mp4"              loop muted playsinline webkit-playsinline preload="auto" style="display:none"></video>
<video id="video-2" src="./멍샌드위치 ar 최종.mp4"  loop muted playsinline webkit-playsinline preload="auto" style="display:none"></video>
<video id="video-3" src="./영상1.mp4"               loop muted playsinline webkit-playsinline preload="auto" style="display:none"></video>

<script>
// ═══════════════════════════════════════════════════════════════
//  마커 → 영상 매핑 (targetIndex 순서 = compile-marker.html 슬롯 순서)
// ═══════════════════════════════════════════════════════════════
const TARGETS = [
  { name: '멍송편',     videoId: 'video-0' },
  { name: '멍치킨',     videoId: 'video-1' },
  { name: '멍샌드위치', videoId: 'video-2' },
  { name: '멍김밥',     videoId: 'video-3', offsetY: -0.03, scale: 1.0 },
];

// ── UI 헬퍼 ─────────────────────────────────────────────────────
let hudTimer = null;

function showHud(text, autoHide = true) {
  const el = document.getElementById('hud-status');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(hudTimer);
  if (autoHide) hudTimer = setTimeout(() => el.classList.remove('on'), 2500);
}

function setLoading(msg, sub = '') {
  document.getElementById('loading-msg').textContent = msg;
  document.getElementById('loading-sub').textContent = sub;
}

function showError(err) {
  console.error('[PAWZ-AR]', err);
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('ar-wrap').style.display        = 'none';

  const icon  = document.getElementById('err-icon');
  const title = document.getElementById('err-title');
  const msg   = document.getElementById('err-msg');
  const e     = (err && err.message) ? err.message : String(err);

  if (err && (err.name === 'NotAllowedError' || /permission|denied/i.test(e))) {
    icon.textContent  = '📷'; title.textContent = '카메라 권한 필요';
    msg.textContent   = '카메라 접근이 거부되었습니다.\n\n📱 iPhone Safari\n설정→Safari→카메라→허용\n\n🤖 Android Chrome\n주소창 🔒→카메라→허용\n\n허용 후 새로고침하세요.';
  } else if (/targets\.mind|fetch|404/i.test(e)) {
    icon.textContent  = '📁'; title.textContent = 'targets.mind 없음';
    msg.textContent   = 'compile-marker.html로 targets.mind를 생성 후 이 폴더에 저장하세요.';
  } else {
    icon.textContent  = '⚠️'; title.textContent = '초기화 실패';
    msg.textContent   = e;
  }
  document.getElementById('error-screen').style.display = 'flex';
}

// ── Three.js 메시 생성 (검정 배경 제거 셰이더) ───────────────────
function createVideoMesh(THREE, videoEl) {
  const tex = new THREE.VideoTexture(videoEl);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      map      : { value: tex },
      threshold: { value: 0.92 },
      softness : { value: 0.06 },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform float threshold;
      uniform float softness;
      varying vec2 vUv;
      void main() {
        vec4 col = texture2D(map, vUv);
        float minCh = min(col.r, min(col.g, col.b));
        if (minCh > threshold) discard;
        float alpha = 1.0 - smoothstep(threshold - softness, threshold, minCh);
        gl_FragColor = vec4(col.rgb, col.a * alpha);
      }`,
    transparent: true,
    side       : THREE.DoubleSide,
    depthWrite : false,
  });

  // 영상 비율에 맞춰 plane 크기 계산 (기준 너비 0.96 = 1.2 * 0.8)
  const W = 0.96;
  const vidW = videoEl.videoWidth  || 1920;
  const vidH = videoEl.videoHeight || 1080;
  const H    = W * (vidH / vidW);

  const geo  = new THREE.PlaneGeometry(W, H);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, 0.001);

  // 텍스처 업데이트 루프
  (function update() {
    tex.needsUpdate = true;
    requestAnimationFrame(update);
  })();

  return mesh;
}

// ── AR 시작 ──────────────────────────────────────────────────────
async function startAR() {
  document.getElementById('start-screen').style.display   = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  setLoading('카메라 초기화 중...');

  // 영상 프리로드
  TARGETS.forEach(t => {
    const v = document.getElementById(t.videoId);
    v.muted = true;
    v.load();
  });

  try {
    // a-entity 목록 생성
    const targetEntities = TARGETS.map((t, i) =>
      `<a-entity id="ar-target-${i}" mindar-image-target="targetIndex: ${i}">
         <a-entity id="video-mesh-host-${i}"></a-entity>
       </a-entity>`
    ).join('\n');

    const wrap = document.getElementById('ar-wrap');
    wrap.style.display = 'block';
    wrap.innerHTML = `
      <a-scene
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.001; filterBeta: 800; warmupTolerance: 1; missTolerance: 5;"
        color-space="sRGB"
        renderer="colorManagement: true; alpha: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        ${targetEntities}
      </a-scene>`;

    const scene = document.getElementById('ar-scene');

    await new Promise((resolve, reject) => {
      if (scene.hasLoaded) { resolve(); return; }
      scene.addEventListener('loaded', resolve, { once: true });
      setTimeout(() => reject(new Error('씬 로딩 타임아웃 (20s)')), 20000);
    });

    setLoading('마커 데이터 로딩 중...');

    const mindarSystem = scene.systems['mindar-image-system'];
    await mindarSystem.start();

    const THREE = window.THREE;

    // 각 타겟에 메시 주입 및 이벤트 연결
    TARGETS.forEach((t, i) => {
      const videoEl = document.getElementById(t.videoId);

      // 영상 메타데이터 로드 후 메시 생성
      const setupMesh = () => {
        const mesh = createVideoMesh(THREE, videoEl);
        if (t.offsetY) mesh.position.y += t.offsetY;
        if (t.scale)   mesh.scale.setScalar(t.scale);
        const host = document.getElementById(`video-mesh-host-${i}`);
        host.setObject3D('mesh', mesh);
      };

      if (videoEl.readyState >= 1) {
        setupMesh();
      } else {
        videoEl.addEventListener('loadedmetadata', setupMesh, { once: true });
        setupMesh(); // 메타데이터 없어도 일단 기본값으로 생성
      }

      const target = document.getElementById(`ar-target-${i}`);

      target.addEventListener('targetFound', () => {
        document.getElementById('scan-hint').style.display = 'none';
        showHud(`🎯 ${t.name} 인식됨`);
        videoEl.play().catch(err => console.warn('[play]', err.message));
      });

      target.addEventListener('targetLost', () => {
        videoEl.pause();
        document.getElementById('hud-status').classList.remove('on');
        // 다른 타겟이 모두 inactive면 힌트 다시 표시
        const anyFound = TARGETS.some((_, j) => {
          const el = document.getElementById(`ar-target-${j}`);
          return el && el.getAttribute('mindar-image-target') && !document.getElementById(`video-${j}`).paused;
        });
        if (!anyFound) document.getElementById('scan-hint').style.display = 'block';
      });
    });

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('scan-hint').style.display      = 'block';

  } catch (err) {
    showError(err);
  }
}
</script>
</body>
</html>
